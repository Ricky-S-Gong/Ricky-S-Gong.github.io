<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SAR Cosmos Lab</title>
  <desc id="desc">Search, Advertising, and Recommendation systems connected by orbital paths.</desc>
  <defs>
    <radialGradient id="space" cx="70%" cy="35%" r="85%">
      <stop offset="0" stop-color="#173d68"/>
      <stop offset="0.55" stop-color="#0b203a"/>
      <stop offset="1" stop-color="#06101e"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#space)"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="3" opacity="0.72">
    <ellipse cx="790" cy="315" rx="330" ry="150" transform="rotate(-14 790 315)"/>
    <ellipse cx="790" cy="315" rx="245" ry="245" transform="rotate(22 790 315)"/>
    <ellipse cx="790" cy="315" rx="410" ry="90" transform="rotate(11 790 315)"/>
  </g>
  <g fill="#e6f4ff">
    <circle cx="1035" cy="169" r="12"/>
    <circle cx="544" cy="444" r="10"/>
    <circle cx="781" cy="70" r="8"/>
  </g>
  <circle cx="790" cy="315" r="84" fill="#102b4d" stroke="#7dd3fc" stroke-width="4"/>
  <text x="790" y="332" fill="#f8fbff" font-family="Arial, sans-serif" font-size="56" font-weight="700" text-anchor="middle">SAR</text>
  <text x="90" y="248" fill="#f8fbff" font-family="Arial, sans-serif" font-size="68" font-weight="700">SAR Cosmos Lab</text>
  <text x="94" y="305" fill="#b9cbe0" font-family="Arial, sans-serif" font-size="28">Search · Advertising · Recommendation</text>
</svg>
